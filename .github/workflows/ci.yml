name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=dme --cov-report=term-missing
      - name: Simulate (fixed seeds, reference-checked)
        run: uv run python -m dme.sim --seeds 0:20 --steps 5000 --reference
      - name: Simulate (fixed seeds, all faults, reference-checked)
        run: uv run python -m dme.sim --seeds 0:20 --steps 5000 --faults all --reference
